</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo"><a href="site pag inicial.html" style="color:#ff7b25;text-decoration:none;">Pet Club</a></div>
      <nav>
        <ul class="nav-links">
          <li><a href="site pag inicial.html">Início</a></li>
          <li><a href="pag produtos.html">Produtos</a></li>
          <li><a href="animais.html" class="active">Animais</a></li>
          <li><a href="contacto.html">Contacto</a></li>

  <div class="page-header">
    <h1>Os nossos <span>Animais</span></h1>
    <p>Conhece os nossos animais e encontra o teu novo companheiro.</p>
  </div>

  <div id="animais-container"></div>

  <footer>
    <div class="footer-logo">Pet Club</div>
    <p>A tua loja de animais online de confiança.</p>
    <div class="footer-links">
      <a href="site pag inicial.html">Início</a>
      <a href="pag produtos.html">Produtos</a>
      <a href="animais.html">Animais</a>
      <a href="contacto.html">Contacto</a>
    </div>
    <p class="footer-copy">© 2026 Pet Club. Todos os direitos reservados.</p>
  </footer>

  <script>
    const secoes = [
      {
        titulo: "Cachorros",
        animais: [
          { nome: "Golden Retriever",         img: "cachorro1.png", desc: "Cão muito amigável, inteligente e carinhoso. Ideal para famílias e crianças.",            idade: "2 anos",   preco: "€250,00" },
          { nome: "Golden Retriever Dourado",  img: "cachorro2.png", desc: "Filhote brincalhão e cheio de energia. Gosta muito de companhia e longas caminhadas.",    idade: "1 ano",    preco: "€320,00" },
          { nome: "Labrador Branco",           img: "cachorro3.png", desc: "Cão nobre, calmo e muito leal. Ótimo companheiro para toda a família.",                   idade: "18 meses", preco: "€280,00" },
          { nome: "Poodle Marrom",             img: "cachorro4.png", desc: "Cão inteligente com pelagem encaracolada. Hipoalergénico e excelente para apartamentos.", idade: "2 anos",   preco: "€270,00" },
          { nome: "Terrier Pequeno",           img: "cachorro5.png", desc: "Cão pequeno, corajoso e brincalhão. Perfeito para espaços reduzidos.",                    idade: "8 meses",  preco: "€200,00" }
        ]
      },
      {
        titulo: "Gatos",
        animais: [
          { nome: "Gato Tabby Cinzento",   img: "gato1.png", desc: "Gato elegante e tranquilo com pelagem cinzenta listrada. Muito carinhoso.",         idade: "1 ano",   preco: "€180,00" },
          { nome: "Gato Branco e Cinzento", img: "gato2.png", desc: "Gato muito comunicativo e inteligente. Excelente companheiro para apartamentos.",   idade: "8 meses", preco: "€220,00" },
          { nome: "Gato Preto e Branco",   img: "gato3.png", desc: "Gato independente com belíssima pelagem. Muito ativo e curioso, adora explorar.",    idade: "1 ano",   preco: "€200,00" },
          { nome: "Gato Tabby Clássico",   img: "gato4.png", desc: "Gato muito elegante e sereno. Pelagem macia e bem cuidada. Adora receber mimos.",    idade: "2 anos",  preco: "€190,00" },
          { nome: "Gato Cinzento",         img: "gato5.png", desc: "Gato tranquilo e afetuoso com olhos expressivos. Ideal para famílias com crianças.", idade: "6 meses", preco: "€170,00" }
        ]
      },
      {
        titulo: "Coelhos",
        animais: [
          { nome: "Coelho Cinzento", img: "coelho2.png", desc: "Coelho macio e tranquilo com pelagem cinzenta. Muito dócil e fácil de domesticar.",  idade: "8 meses",  preco: "€45,00" },
          { nome: "Coelho Branco",   img: "coelho3.png", desc: "Coelho puro branco muito fofo e carinhoso. Sociável e brincalhão.",                   idade: "6 meses",  preco: "€50,00" },
          { nome: "Coelho Bicolor",  img: "coelho1.png", desc: "Coelho bicolor muito bonito e dócil. Muito calmo e ideal para ambientes tranquilos.", idade: "10 meses", preco: "€55,00" }
        ]
      },
      {
        titulo: "Pássaros",
        animais: [
          { nome: "Calopsita",         img: "passaro5.png", desc: "Ave sociável e divertida com crista elegante. Aprende sons e gosta de interação.",   idade: "1 ano",    preco: "€120,00" },
          { nome: "Periquito Cinzento", img: "passaro4.png", desc: "Pequeno pássaro muito alegre e ativo. Fácil de cuidar e ideal para iniciantes.",    idade: "6 meses",  preco: "€40,00"  },
          { nome: "Cacatua",           img: "passaro1.png", desc: "Cacatua colorida e muito social. Inteligente e capaz de aprender palavras.",         idade: "18 meses", preco: "€130,00" },
          { nome: "Papagaio Verde",    img: "passaro3.png", desc: "Papagaio inteligente e comunicativo. Excelente imitador de sons e palavras.",        idade: "2 anos",   preco: "€250,00" },
          { nome: "Periquito Azul",    img: "passaro2.png", desc: "Periquito pequeno muito vivo e brincalhão. Cores bonitas e alegres.",                idade: "4 meses",  preco: "€35,00"  }
        ]
      },
      {
        titulo: "Peixes",
        animais: [
          { nome: "Peixe Beta",    img: "peixe2.png", desc: "Peixe colorido e elegante muito popular. Ideal para aquários pequenos.", idade: "6 meses", preco: "€12,00" },
          { nome: "Peixe Palhaço", img: "peixe3.png", desc: "Peixe colorido e elegante. Calmo e fácil de cuidar.",                   idade: "6 meses", preco: "€12,00" },
          { nome: "Peixe Dourado", img: "peixe1.png", desc: "Peixe clássico e muito popular. Ideal para aquários de água fria.",     idade: "6 meses", preco: "€12,00" }
        ]
      },
      {
        titulo: "Pequenos Roedores",
        animais: [
          { nome: "Hamster",            img: "Hamister2.png",         desc: "Pequeno roedor muito fofo com pelagem macia e delicada.",            idade: "4 meses", preco: "€90,00" },
          { nome: "Chinchila",          img: "chinchila.png",          desc: "Pequeno roedor muito fofo com pelagem macia. Tranquilo e curioso.", idade: "8 meses", preco: "€80,00" },
          { nome: "Porquinho da Índia", img: "porquinho da india.png", desc: "Pequeno roedor muito fofo com pelagem macia e muito dócil.",        idade: "8 meses", preco: "€80,00" }
        ]
      }
    ];

    const container = document.getElementById('animais-container');

    secoes.forEach(function(secao) {
      const cards = secao.animais.map(function(a) {
        return `
          <div class="animal-card">
            <div class="foto-animal">
              <img src="Animais foto/${a.img}" alt="${a.nome}">
            </div>
            <div class="animal-info">
              <h3>${a.nome}</h3>
              <p>${a.desc}</p>
              <p><strong>Idade:</strong> ${a.idade}</p>
              <span class="preco">${a.preco}</span>
            </div>
          </div>`;
      }).join('');

      container.innerHTML += `
        <section class="categoria">
          <h2 class="titulo-secao">${secao.titulo}</h2>
          <div class="animais-grid">${cards}</div>
        </section>`;
    });
  </script>

</body>
</html>

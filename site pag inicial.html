<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetClub | Minimalist Pet Shop</title>
    <link rel="stylesheet" href="css pag inicial.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

   <header class="cabecalho">
        <h1 class="logo">PET SHOP</h1>
        <nav class="menu">
            <a href="#">Cães</a>
            <a href="#">Gatos</a>
            <a href="#">Passarinhos</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <section class="banner">
        <h2>Bem-vindo ao nosso Pet Shop</h2>
        <p>Tudo o que seu melhor amigo precisa em um só lugar.</p>
    </section>

    <main class="conteudo">
        <h2 class="titulo-secao">Nossos Produtos</h2>
        
        <div class="grade-produtos">
            
            <div class="cartao-produto">
                <div class="foto-produto"></div>
                <h3>Ração Especial</h3>
                <p>R$ 50,00</p>
                <button>Comprar</button>
            </div>

            <div class="cartao-produto">
                <div class="foto-produto"></div>
                <h3>Brinquedo Corda</h3>
                <p>25,00</p>
                <button>Comprar</button>
            </div>

            <div class="cartao-produto">
                <div class="foto-produto"></div>
                <h3>Casinha Confort</h3>
                <p>R$ 120,00</p>
                <button>Comprar</button>
            </div>

        </div>
    </main>

    <footer class="rodape">
        <p>Endereço: Rua dos Pets, 123</p>
    </footer>
</body>
</html>
</body>
</html>
